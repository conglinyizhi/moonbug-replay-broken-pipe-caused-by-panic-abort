name: moon broken-pipe abort

# 两条方案对应的 lane：
#   hit-the-bug         命中问题  —— 断言 moon 在 EPIPE 下 abort（exit 134）
#   workaround          绕过      —— 断言几种安全的调用方式都不会 abort（exit 0）
#   upstream-fix-status 修复验收  —— 上游修好后转绿，用来判断何时撤掉 workaround
#
# 工具链一律装最新版，不钉版本。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hit-the-bug:
    name: 命中问题 lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit 工具链（最新版）
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 记录工具链版本
        run: moon version --all

      - name: 跑命中问题 lane
        run: make bug

  workaround:
    name: 绕过 lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit 工具链（最新版）
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 跑绕过 lane
        run: make workaround

  upstream-fix-status:
    name: 上游是否已修（允许失败）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit 工具链（最新版）
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 跑修复验收 lane
        run: make fixed
